services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ondaluz
      POSTGRES_USER: ondaluz
      POSTGRES_PASSWORD: ondaluz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ondaluz -d ondaluz"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  data-loader:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/loader.js"]
    environment:
      DATABASE_URL: postgresql://ondaluz:ondaluz@postgres:5432/ondaluz
      DATASET_PATH: /dataset
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ondaluz-pack/data:/dataset:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://ondaluz:ondaluz@postgres:5432/ondaluz
      PORT: 3000
    depends_on:
      data-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 15
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
